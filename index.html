<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Hanya file dari situs ini yang boleh dimuat/dijalankan; tanpa skrip atau gaya inline. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Kuis Anatomi Renal</title>
<link rel="icon" href="images/bg.webp">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Kuis Anatomi Renal</h1>
  <p id="status" aria-live="polite"></p>
  <div id="pemutar">
    <button id="musik" type="button" class="ikon" aria-label="Putar musik">
      <svg class="ik-putar" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l14 8-14 8z"/></svg>
      <svg class="ik-jeda" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button id="laguSebelum" type="button" class="ikon" aria-label="Lagu sebelumnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM20 4L9 12l11 8z"/></svg>
    </button>
    <button id="laguLanjut" type="button" class="ikon" aria-label="Lagu berikutnya">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 4h3v16h-3zM4 4l11 8-11 8z"/></svg>
    </button>
  </div>
  <audio id="audio" preload="none"></audio>
</header>

<main>
  <section id="mulai">
    <p>Pilih bab. Semua label pada gambar ditutup; tebak struktur yang bertanda <b>?</b>.</p>
    <div id="bab"></div>
  </section>

  <section id="kuis" hidden>
    <div class="geser"><div id="panggung"><img id="gambar" alt="Gambar anatomi dengan label tertutup" loading="lazy"></div></div>
    <form id="form" autocomplete="off">
      <label for="jawab" id="tanya">Struktur apa yang ditunjuk tanda ?</label>
      <div class="baris">
        <input id="jawab" type="text" required maxlength="80" autocapitalize="off" spellcheck="false" placeholder="Ketik jawaban…">
        <button id="periksa">Periksa</button>
      </div>
    </form>
    <div id="umpan"></div>
    <div class="baris navigasi">
      <button id="sebelum" type="button">Sebelumnya</button>
      <button id="lanjut" type="button">Berikutnya</button>
    </div>
  </section>

  <section id="akhir" hidden>
    <h2 id="skorAkhir"></h2>
    <ol id="salah"></ol>
    <button id="ulangi" type="button">Ulangi yang salah</button>
    <button id="kembali" type="button" class="polos">Pilih bab lain</button>
  </section>

  <section id="edit" hidden>
    <p>Mode edit: geser kotak, tarik sudut kanan-bawah untuk mengubah ukuran, lalu salin koordinat ke <code>data.js</code>.</p>
    <div class="baris">
      <select id="pilihGambar" aria-label="Pilih gambar"></select>
      <button id="tambah" type="button">+ Kotak</button>
    </div>
    <div class="geser"><div id="panggungEdit"><img id="gambarEdit" alt=""></div></div>
    <textarea id="koordinat" rows="10" readonly aria-label="Koordinat penutup"></textarea>
  </section>
</main>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
